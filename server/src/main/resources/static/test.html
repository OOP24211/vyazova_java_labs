<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Chat - Полная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            padding: 20px;
        }
        .chat-container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            height: calc(100vh - 40px);
            display: flex;
        }
        .sidebar {
            width: 300px;
            background: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 20px;
            background: #34495e;
            border-bottom: 1px solid #3d566e;
        }
        .rooms-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        .room-item {
            padding: 12px;
            margin: 5px 0;
            background: #34495e;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .room-item:hover {
            background: #3d566e;
            transform: translateX(5px);
        }
        .room-item.active {
            background: #667eea;
        }
        .users-list {
            padding: 20px;
            border-top: 1px solid #3d566e;
        }
        .users-list h4 {
            margin-bottom: 10px;
        }
        .user-item {
            padding: 5px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-item::before {
            content: "●";
            color: #2ecc71;
            font-size: 10px;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header h2 {
            color: #333;
        }
        .connection-status {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
        }
        .status-connected {
            background: #2ecc71;
            color: white;
        }
        .status-disconnected {
            background: #e74c3c;
            color: white;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .message-content {
            flex: 1;
        }
        .message-header {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }
        .message-username {
            font-weight: bold;
            color: #333;
        }
        .message-time {
            font-size: 11px;
            color: #999;
        }
        .message-text {
            color: #666;
            line-height: 1.4;
        }
        .message-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 10px;
            margin-top: 5px;
            cursor: pointer;
        }
        .system-message {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            background: #e3f2fd;
            border-radius: 20px;
            font-size: 12px;
            color: #1976d2;
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #dee2e6;
            display: flex;
            gap: 10px;
        }
        .input-area input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }
        .input-area input[type="text"]:focus {
            border-color: #667eea;
        }
        .input-area button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-area button:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .file-upload-btn {
            background: #48bb78;
        }
        .file-upload-btn:hover {
            background: #38a169;
        }
        .create-room-btn {
            width: 100%;
            padding: 10px;
            background: #667eea;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
        }
        .login-box input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #dee2e6;
            border-radius: 8px;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div id="loginOverlay" class="login-overlay">
    <div class="login-box">
        <h2>Welcome to Chat</h2>
        <input type="text" id="loginUsername" placeholder="Enter username">
        <input type="text" id="loginRoomId" placeholder="Room ID" value="1">
        <button onclick="login()">Join Chat</button>
    </div>
</div>

<div class="chat-container" style="display: none" id="chatContainer">
    <div class="sidebar">
        <div class="sidebar-header">
            <h3>Rooms</h3>
        </div>
        <div class="rooms-list" id="roomsList"></div>
        <button class="create-room-btn" onclick="createRoom()">+ Create New Room</button>
        <div class="users-list">
            <h4>Online Users</h4>
            <div id="usersList"></div>
        </div>
    </div>
    <div class="main-chat">
        <div class="chat-header">
            <h2 id="currentRoomName">Room #1</h2>
            <div>
                <span id="connectionStatus" class="connection-status status-disconnected">Disconnected</span>
            </div>
        </div>
        <div class="messages-area" id="messagesArea"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Type your message and press Enter..." disabled>
            <input type="file" id="fileInput" style="display: none" onchange="uploadFile(this)">
            <button onclick="document.getElementById('fileInput').click()" class="file-upload-btn" id="uploadBtn" disabled>📎 Upload File</button>
            <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
        </div>
    </div>
</div>

<script>
    let ws = null;
    let currentUser = null;
    let currentRoomId = 1;
    let rooms = [];

    function login() {
        const username = document.getElementById('loginUsername').value.trim();
        const roomId = parseInt(document.getElementById('loginRoomId').value);

        if (!username) {
            alert('Please enter username');
            return;
        }

        currentUser = username;
        currentRoomId = roomId;

        registerUser();
        connectWebSocket();

        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('chatContainer').style.display = 'flex';
        document.getElementById('connectionStatus').className = 'connection-status status-connected';
        document.getElementById('connectionStatus').textContent = 'Connected';
    }

    function registerUser() {
        fetch('/users/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: currentUser, password: '123'})
        }).then(() => loadRooms());
    }

    function connectWebSocket() {
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        ws = new WebSocket(`${protocol}//${window.location.host}/chat`);

        ws.onopen = () => {
            console.log('WebSocket connected');
            ws.send(JSON.stringify({
                type: 'join',
                username: currentUser,
                roomId: currentRoomId
            }));
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('uploadBtn').disabled = false;
            loadMessageHistory();
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            handleWebSocketMessage(data);
        };

        ws.onclose = () => {
            console.log('WebSocket disconnected');
            document.getElementById('connectionStatus').className = 'connection-status status-disconnected';
            document.getElementById('connectionStatus').textContent = 'Disconnected';
            setTimeout(connectWebSocket, 3000);
        };
    }

    function handleWebSocketMessage(data) {
        switch(data.type) {
            case 'message':
                displayMessage(data);
                break;
            case 'user_joined':
                addSystemMessage(`${data.username} joined the room`);
                break;
            case 'user_left':
                addSystemMessage(`${data.username} left the room`);
                break;
            case 'user_list':
                updateUsersList(data.users);
                break;
        }
    }

    function loadRooms() {
        fetch('/api/rooms')
            .then(res => res.json())
            .then(data => {
                rooms = data;
                displayRooms();
            });
    }

    function displayRooms() {
        const container = document.getElementById('roomsList');
        if (!container) return;
        container.innerHTML = rooms.map(room => `
            <div class="room-item ${room.id === currentRoomId ? 'active' : ''}" onclick="switchRoom(${room.id})">
                ${room.name}
            </div>
        `).join('');
    }

    function switchRoom(roomId) {
        currentRoomId = roomId;
        displayRooms();
        loadMessageHistory();
        document.getElementById('currentRoomName').textContent = `Room #${roomId}`;

        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
                type: 'join',
                username: currentUser,
                roomId: currentRoomId
            }));
        }
    }

    function createRoom() {
        const roomName = prompt('Enter room name:');
        if (!roomName) return;

        fetch('/api/rooms', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: roomName})
        }).then(() => loadRooms());
    }

    function loadMessageHistory() {
        fetch(`/messages?roomId=${currentRoomId}`)
            .then(res => res.json())
            .then(messages => {
                const messagesArea = document.getElementById('messagesArea');
                if (!messagesArea) return;
                messagesArea.innerHTML = '';
                messages.forEach(msg => displayMessage(msg));
                messagesArea.scrollTop = messagesArea.scrollHeight;
            })
            .catch(err => console.error('Error loading history:', err));
    }

    function displayMessage(msg) {
        const messagesArea = document.getElementById('messagesArea');
        if (!messagesArea) return;

        const messageDiv = document.createElement('div');
        messageDiv.className = 'message';

        const time = new Date(msg.timestamp).toLocaleTimeString();
        const senderName = msg.sender?.username || msg.username || 'Unknown';
        const senderInitial = senderName.charAt(0).toUpperCase();

        if (msg.fileUrl) {
            if (msg.fileType === 'image') {
                messageDiv.innerHTML = `
                    <div class="message-avatar">${senderInitial}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-username">${senderName}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <img src="${msg.fileUrl}" class="message-image" onclick="window.open('${msg.fileUrl}')">
                        <div class="message-text">${msg.text || ''}</div>
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="message-avatar">${senderInitial}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-username">${senderName}</span>
                            <span class="message-time">${time}</span>
                        </div>
                        <div class="message-text">📎 <a href="${msg.fileUrl}" target="_blank">${msg.fileName || 'Download'}</a></div>
                        <div class="message-text">${msg.text || ''}</div>
                    </div>
                `;
            }
        } else {
            messageDiv.innerHTML = `
                <div class="message-avatar">${senderInitial}</div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-username">${senderName}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text">${msg.text}</div>
                </div>
            `;
        }

        messagesArea.appendChild(messageDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function addSystemMessage(text) {
        const messagesArea = document.getElementById('messagesArea');
        if (!messagesArea) return;
        const sysDiv = document.createElement('div');
        sysDiv.className = 'system-message';
        sysDiv.textContent = text;
        messagesArea.appendChild(sysDiv);
        messagesArea.scrollTop = messagesArea.scrollHeight;
    }

    function updateUsersList(usersJson) {
        const container = document.getElementById('usersList');
        if (!container) return;
        try {
            const users = JSON.parse(usersJson);
            container.innerHTML = users.map(user => `
                <div class="user-item">${user}</div>
            `).join('');
        } catch(e) {
            console.error('Error parsing users:', e);
        }
    }

    function sendMessage() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

        ws.send(JSON.stringify({
            type: 'message',
            roomId: currentRoomId,
            username: currentUser,
            text: text
        }));

        input.value = '';
    }

    function uploadFile(fileInput) {
        const file = fileInput.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append('file', file);
        formData.append('roomId', currentRoomId);
        formData.append('username', currentUser);

        fetch('/files/upload', {
            method: 'POST',
            body: formData
        }).then(response => response.json())
          .then(() => {
              fileInput.value = '';
              loadMessageHistory();
          })
          .catch(err => console.error('Error uploading file:', err));
    }

    // Enter для отправки сообщения
    document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });
</script>
</body>
</html>
